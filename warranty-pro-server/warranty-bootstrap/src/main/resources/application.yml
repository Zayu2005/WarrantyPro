server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: warranty-pro-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 中间件可用 docker compose up -d 一键拉起（见 docker-compose.yml）
    url: jdbc:mysql://localhost:3306/warranty_pro?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 本地开发数据库密码；生产环境通过 WARRANTY_MYSQL_PASSWORD 覆盖
    password: ${WARRANTY_MYSQL_PASSWORD:1234}

  data:
    redis:
      host: localhost
      port: 6379

  servlet:
    multipart:
      # 照片上传限制（docs/04 §6：单文件 ≤10MB）
      max-file-size: 10MB
      max-request-size: 60MB

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto               # 与 DDL 的自增主键一致
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.warrantypro: debug

# ==================== 业务自定义配置（实现阶段使用） ====================
warranty:
  # JWT（生产环境必须用环境变量覆盖 secret）
  jwt:
    secret: warrantypro-dev-jwt-secret-please-change-in-production
    access-expire-minutes: 120
    refresh-expire-days: 7

  # 智能派单参数（docs/03 §5.1；技能领域不限，无技能因子）
  dispatch:
    weights:
      load: 0.40
      location: 0.35
      rating: 0.25
    accept-timeout-minutes: 15      # 历史兼容参数；当前使用到场超时改派
    max-reassign-rounds: 3          # 最大改派轮次
    max-concurrent: 3               # 师傅并发单量上限
    auto-dispatch-timeout-minutes: 15  # 客服超时未处理转自动派单
    arrive-timeout-hours: 4         # 到场超时（小时），超时自动改派
    arrive-scan-ms: 60000           # 到场超时扫描间隔（毫秒）

  # 保修到期预警（docs/03 §7）
  warranty-alert:
    ahead-days: 90

  # 验收超时默认通过（docs/03 §8）
  confirm:
    auto-pass-hours: 48
    scan-ms: 60000

  # AI Agent（docs/05；OpenAI 兼容协议，供应商可配置切换）
  ai:
    enabled: true
    provider: zhipu                 # OpenAI-compatible provider: zhipu / deepseek
    base-url: https://open.bigmodel.cn/api/paas/v4
    model: glm-4v-plus
    embedding-model: embedding-3
    api-key: ${WARRANTY_AI_API_KEY:}
    health-check-interval-seconds: 60
    workflow:
      poll-ms: 2000
      max-input-chars: 2000
