# WarrantyPro 本地中间件（docs/04 §5.1 演示环境）
# 用法：docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: warranty-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: warranty_pro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "3306:3306"
    volumes:
      - warranty-mysql-data:/var/lib/mysql

  redis-stack:
    image: redis/redis-stack:latest
    container_name: warranty-redis
    ports:
      - "6379:6379"   # Redis（缓存 + 向量检索 RediSearch）
      - "8001:8001"   # RedisInsight 管理界面
    volumes:
      - warranty-redis-data:/data

  minio:
    image: minio/minio:latest
    container_name: warranty-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 管理控制台
    volumes:
      - warranty-minio-data:/data

volumes:
  warranty-mysql-data:
  warranty-redis-data:
  warranty-minio-data:
